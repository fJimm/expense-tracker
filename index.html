<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Expense Tracker</h1>

    <!-- Form -->
    <form id="expense-form" class="row g-3 mb-4">
      <div class="col-md-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" id="date" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label for="category" class="form-label">Category</label>
        <select id="category" class="form-select" required>
          <option value="">Choose...</option>
          <option>Operasional</option>
          <option>Gaji</option>
          <option>Marketing</option>
          <option>Transport</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="amount" class="form-label">Amount (Rp)</label>
        <input type="number" id="amount" class="form-control" min="1" required>
      </div>
      <div class="col-md-3">
        <label for="department" class="form-label">Department</label>
        <input type="text" id="department" class="form-control" required>
      </div>
      <div class="col-12">
        <button type="submit" id="submit-btn" class="btn btn-primary">Add Expense</button>
        <button type="button" id="cancel-btn" class="btn btn-secondary d-none">Cancel</button>
      </div>
    </form>
    
    <div class="row mb-3">
      <div class="col-md-3">
        <label for="filter-category" class="form-label">Filter by category</label>
        <select id="filter-category" class="form-select">
          <option value="all">All categories</option>
          <option>Operasional</option>
          <option>Gaji</option>
          <option>Marketing</option>
          <option>Transport</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <table class="table table-striped">
      <thead>
        <tr><th>Date</th><th>Category</th><th>Department</th><th>Amount</th><th></th></tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>

    <h4>Total: <span id="total">Rp 0</span></h4>
  </div>

  <script src="script.js"></script>
</body>
</html>
